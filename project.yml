name: Teeter
options:
  bundleIdPrefix: io.witlox
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # DEVELOPMENT_TEAM is set via Configuration/Local.xcconfig (gitignored).
    # bootstrap.sh seeds it from Local.xcconfig.example on first run.
    TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
targets:
  Teeter:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    configFiles:
      Debug: Configuration/Local.xcconfig
      Release: Configuration/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.witlox.teeter
        INFOPLIST_FILE: Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
